services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twdash-bot
    restart: unless-stopped
    working_dir: /app
    volumes:
      - type: bind
        source: ./config.yml
        target: /app/config.yml
        read_only: true
        bind:
          create_host_path: false
    environment:
      - TZ=Asia/Taipei
      - RUST_LOG=info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
