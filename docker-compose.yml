services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twdash-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Taipei
      - RUST_LOG=info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
